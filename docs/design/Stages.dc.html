<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#005185}a:hover{color:#003A60}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF2F6; font-family: Inter, system-ui, sans-serif; color: #10202F; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #005185; color: #FFFFFF; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Squads.dc.html" aria-label="Back to squads" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; line-height: 1">Squad 2</div>
        <div style="font-size: 13px; color: #C9D6E5">8 shooters</div>
      </div>
    </div>
  </div>
  <div style="padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase">Select stage</div>
    <div style="font-size: 13px; color: #4A5B6C"><span style="font-weight: 700; color: #10202F">2 / 6</span> stages done</div>
  </div>
  <div style="flex-grow: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
      <a href="Shooters.dc.html" style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border: {{s.border}}; border-radius: 14px; padding: 12px 14px; text-decoration: none; color: #10202F">
        <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: {{s.tileBg}}; color: {{s.tileFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px">{{s.n}}</div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
            <div style="font-weight: 700; font-size: 16px">{{s.name}}</div>
            <div style="flex-shrink: 0; font-size: 12px; font-weight: 700; color: {{s.stateFg}}">{{s.state}}</div>
          </div>
          <div style="font-size: 13px; color: #4A5B6C">min. {{s.rounds}} rounds · {{s.targets}}</div>
          <div style="font-size: 12px; color: #4A5B6C">{{s.scored}}</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A8A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = { state: 'Done', stateFg: '#2F4A22', tileBg: '#E3EEDC', tileFg: '#2F4A22', border: '2px solid transparent', scored: '8 / 8 scored' };
    const now = { state: 'In progress', stateFg: '#005185', tileBg: '#005185', tileFg: '#FFFFFF', border: '2px solid #005185', scored: '3 / 8 scored' };
    const todo = { state: 'Not started', stateFg: '#4A5B6C', tileBg: '#E6ECF2', tileFg: '#005185', border: '2px solid transparent', scored: '0 / 8 scored' };
    return {
      stages: [
        { n: 1, name: 'Vehicle Stop', rounds: 16, targets: '6 paper, 1 steel', ...done },
        { n: 2, name: 'Barricade', rounds: 12, targets: '5 paper, 2 no-shoots', ...done },
        { n: 3, name: 'Rapid Entry', rounds: 15, targets: '6 paper, 3 steel, 2 no-shoots', ...now },
        { n: 4, name: 'Long Corridor', rounds: 20, targets: '8 paper, 4 steel', ...todo },
        { n: 5, name: 'Strong Hand Only', rounds: 8, targets: '4 paper', ...todo },
        { n: 6, name: 'Casualty Drag', rounds: 14, targets: '5 paper, 2 steel', ...todo }
      ]
    };
  }
}
</script>
</body>
</html>
