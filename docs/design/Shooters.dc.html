<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shooters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#005185}a:hover{color:#003A60}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF2F6; font-family: Inter, system-ui, sans-serif; color: #10202F; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #005185; color: #FFFFFF; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Stages.dc.html" aria-label="Back to stages" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; line-height: 1">Squad 2 · Stage 3</div>
        <div style="font-size: 13px; color: #C9D6E5">Min. 15 rounds · 6 paper, 3 steel, 2 No-shoot</div>
      </div>
    </div>
  </div>
  <div style="padding: 14px 16px 8px; display: flex; align-items: baseline; justify-content: space-between">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase">Shooting order</div>
    <div style="font-size: 13px; color: #4A5B6C"><span style="font-weight: 700; color: #10202F">3 / 8</span> scored</div>
  </div>
  <div style="flex-grow: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
    <sc-for list="{{shooters}}" as="p" hint-placeholder-count="8">
      <a href="Scoring.dc.html" style="display: flex; align-items: center; gap: 12px; background: {{p.bg}}; border: {{p.border}}; border-radius: 12px; padding: 10px 12px; min-height: 44px; text-decoration: none; color: #10202F">
        <div style="width: 30px; flex-shrink: 0; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; color: #4A5B6C">{{p.order}}</div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="font-weight: 700; font-size: 15px">{{p.name}}</div>
          <div style="font-size: 12px; color: #4A5B6C">#{{p.no}}</div>
        </div>
        <div style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <div style="font-weight: 700; font-size: 15px; color: {{p.valueFg}}">{{p.value}}</div>
          <div style="font-size: 11px; font-weight: 600; color: #4A5B6C; text-transform: uppercase">{{p.label}}</div>
        </div>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const done = (hf) => ({ value: hf, label: 'HF', valueFg: '#2F4A22', bg: '#FFFFFF', border: '2px solid transparent' });
    const up = { value: 'Shooting', label: '', valueFg: '#005185', bg: '#E6F0F8', border: '2px solid #005185' };
    const deck = { value: 'On deck', label: '', valueFg: '#4A5B6C', bg: '#FFFFFF', border: '2px solid transparent' };
    const wait = { value: '—', label: '', valueFg: '#4A5B6C', bg: '#FFFFFF', border: '2px solid transparent' };
    return {
      shooters: [
        { order: 1, name: 'Mikko Lahtinen', no: 112, div: 'Pistooli', ...done('5.8120') },
        { order: 2, name: 'Sanna Heikkilä', no: 87, div: 'Pistooli', ...done('6.4213') },
        { order: 3, name: 'Jari Koskinen', no: 140, div: 'Kivääri', ...done('4.9031') },
        { order: 4, name: 'Antti Mäkelä', no: 23, div: 'Pistooli', ...up },
        { order: 5, name: 'Tiina Salo', no: 64, div: 'Kivääri', ...deck },
        { order: 6, name: 'Petri Nieminen', no: 9, div: 'Pistooli', ...wait },
        { order: 7, name: 'Laura Järvinen', no: 131, div: 'Pistooli', ...wait },
        { order: 8, name: 'Ville Rantanen', no: 75, div: 'Kivääri', ...wait }
      ]
    };
  }
}
</script>
</body>
</html>
